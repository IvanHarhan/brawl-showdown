services:
  - type: web
    name: brawl-showdown
    runtime: node
    plan: free
    region: frankfurt
    buildCommand: npm ci --include=dev && npm run build:server
    startCommand: node server/dist/index.js
    healthCheckPath: /health
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: SERVE_CLIENT
        value: "0"
